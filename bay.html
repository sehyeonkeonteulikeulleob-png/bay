<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>타석 카운트다운 · SEHYEON CC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="config.js?v=202611190955"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background: #0d1710; color: #f2f0e8; height: 100vh; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5vh 6vw; overflow: hidden; user-select: none; text-align: center; }
  .logo { height: 11vh; width: auto; display: block; margin: 0 auto; }
  .bayno { font-size: 6vh; font-weight: 900; margin-top: 2vh; }
  .state { display: inline-block; font-size: 2.6vh; font-weight: 700; border-radius: 999px; padding: 1.2vh 3vw; margin-top: 1.5vh; border: 1px solid; }
  .mid { display: flex; flex-direction: column; align-items: center; gap: 2.5vh; }
  .cap { font-size: 2.6vh; color: #8fa193; }
  #time { font-size: 20vh; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
  #barwrap { width: 70vw; max-width: 520px; height: 2.2vh; background: #1a2a1f; border-radius: 999px; overflow: hidden; }
  #bar { height: 100%; background: #4cc07e; width: 0%; }
  .note { font-size: 2vh; color: #8fa193; line-height: 1.5; }
  #endBtn { font-family: inherit; min-height: 60px; border: 1px solid #2e4636; border-radius: 14px; background: #13251a; color: #b9c2b8; font-size: 2.4vh; font-weight: 700; padding: 1.5vh 5vw; cursor: pointer; margin-top: 1.5vh; }
  #miniBtn { font-family: inherit; min-height: 52px; border: 1px solid #5a4a22; border-radius: 14px; background: transparent; color: #e6c877; font-size: 2.1vh; font-weight: 700; padding: 1.2vh 4vw; cursor: pointer; margin-top: 1.5vh; }
  #miniBtn:disabled { border-color: #2e4636; color: #6f7d72; }
  #confirm { display: none; gap: 12px; justify-content: center; margin-top: 1.5vh; }
  #confirm button { font-family: inherit; min-height: 60px; border-radius: 14px; font-size: 2.4vh; font-weight: 900; padding: 1.5vh 6vw; border: none; }
  .st-busy { color: #e88d85; background: #2a1715; border-color: #553029; }
  .st-free { color: #7fd8a4; background: #13251a; border-color: #2e4636; }
  .warn #time { color: #f0cd7e; } .warn #bar { background: #e3a93c; }
</style>
</head>
<body>
  <div>
    <img class="logo" src="logo.png" alt="세현 컨트리클럽">
    <div class="bayno" id="bayno">-번 타석</div>
    <div class="state st-free" id="state">이용 가능</div>
  </div>

  <div class="mid">
    <div class="cap" id="cap">입구 태블릿에서 체크인하세요</div>
    <div id="time">--:--</div>
    <div id="barwrap"><div id="bar"></div></div>
  </div>

  <div>
    <div class="note">종료 직전과 종료 시 음성 안내가 나옵니다</div>
    <button id="endBtn" style="display:none" onclick="askEnd()">먼저 끝났어요 (조기 종료)</button>
    <button id="miniBtn" data-nofs onclick="miniOpen()">작게 띄우기 (항상 위)</button>
    <div id="confirm">
      <button style="background:#e0594f;color:#fff" onclick="endNow()">종료하기</button>
      <button style="background:#1a2a1f;color:#b9c2b8" onclick="cancelEnd()">취소</button>
    </div>
  </div>

<script>
var BAY = Number(param('no', '1'));
document.getElementById('bayno').textContent = BAY + '번 타석';
var st = null, stAt = 0, announced = {}, busyCall = false;

function poll() {
  apiGet('status').then(function (s) { if (s) { st = s; stAt = Date.now(); render(); } }).catch(function () {});
}
function render() {
  if (!st) return;
  var b = st.bays.filter(function (x) { return x.no === BAY; })[0];
  if (!b) return;
  var stateEl = document.getElementById('state'), timeEl = document.getElementById('time');
  if (b.status === 'busy') {
    var nowS = st.now + (Date.now() - stAt), total = playTotal(b), pr = prepLeft(b, nowS);
    var r = Math.min(total, Math.max(0, Math.round((b.endAt - nowS) / 1000)));
    document.body.className = r <= st.warnSec ? 'warn' : '';
    stateEl.className = 'state st-busy';
    stateEl.textContent = pr ? '입장 준비 중 · ' + pr + '초 후 시작' : '사용 중 · ' + durLabel(total) + ' 이용';
    document.getElementById('cap').textContent = pr ? '준비가 끝나면 시간이 줄어듭니다' : '남은 시간';
    timeEl.textContent = mmss(r);
    miniUpdate({ top: BAY + '번 타석 · ' + (pr ? pr + '초 후 시작' : r === 0 ? '이용 시간 종료' : r <= st.warnSec ? '곧 종료' : '남은 시간'), time: mmss(r), level: r === 0 ? 'end' : r <= st.warnSec ? 'warn' : 'busy' });
    document.getElementById('bar').style.width = Math.round(r / total * 100) + '%';
    if (document.getElementById('confirm').style.display !== 'flex') document.getElementById('endBtn').style.display = 'inline-block';
    var k = BAY + '-' + b.endAt;
    if (r <= st.warnSec && r > 0 && !announced[k + '-w']) { announced[k + '-w'] = 1; speak(bayWord(BAY) + '번 타석, 종료 ' + durLabel(st.warnSec) + ' 전입니다.'); }
    if (r === 0 && !announced[k + '-e']) { announced[k + '-e'] = 1; speak(bayWord(BAY) + '번 타석 이용시간이 종료되었습니다. 이용해 주셔서 감사합니다.'); }
  } else {
    document.body.className = '';
    stateEl.className = 'state st-free';
    stateEl.textContent = b.status === 'held' ? '입장 대기 중' : '이용 가능';
    document.getElementById('cap').textContent = b.status === 'held' ? '호출된 고객 입장 대기' : '입구 태블릿에서 체크인하세요';
    timeEl.textContent = '--:--';
    miniUpdate({ top: BAY + '번 타석 · ' + (b.status === 'held' ? '입장 대기 중' : '이용 가능'), time: '', level: b.status === 'held' ? 'held' : 'free' });
    document.getElementById('bar').style.width = '100%';
    document.getElementById('endBtn').style.display = 'none';
    document.getElementById('confirm').style.display = 'none';
  }
}
// 브라우저 기본 confirm 창 대신 화면 내 확인 버튼 사용
function askEnd() { document.getElementById('endBtn').style.display = 'none'; document.getElementById('confirm').style.display = 'flex'; }
function cancelEnd() { document.getElementById('confirm').style.display = 'none'; render(); }
function endNow() {
  if (busyCall) return; busyCall = true;
  apiPost('end', { bay: BAY }).then(function () { busyCall = false; cancelEnd(); poll(); })
    .catch(function () { busyCall = false; });
}
// 작은 타이머 창 (다른 프로그램 위에 항상 떠 있음)
(function () {
  var b = document.getElementById('miniBtn');
  if (!miniSupported()) { b.disabled = true; b.textContent = '작게 띄우기는 크롬·엣지에서만 됩니다'; }
})();
function onMiniEnd() { endNow(); }   // 작은 창의 [먼저 끝났어요] → 종료
function onMiniChange(open) { document.getElementById('miniBtn').textContent = open ? '작은 창 닫기' : '작게 띄우기 (항상 위)'; if (open && st) render(); }
setInterval(function () { if (st) render(); }, 1000);
poll(); setInterval(poll, 10000);
</script>
</body>
</html>
