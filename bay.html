<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>타석 타이머 (테스트)</title>
<script src="config.js"></script>
<style>
  body { margin: 0; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; text-align: center; }
  #no { font-size: 6vh; font-weight: bold; }
  #state { font-size: 3vh; }
  #time { font-size: 18vh; font-weight: bold; }
  button { font-size: 3vh; padding: 2vh 5vw; }
  .warn #time { color: #e90; }
</style>
</head>
<body>
  <div id="no"></div>
  <div id="state">-</div>
  <div id="time">--:--</div>
  <button id="end" style="display:none" onclick="ask()">먼저 끝났어요</button>
  <div id="cf" style="display:none"><button onclick="endNow()">종료하기</button> <button onclick="cancel()">취소</button></div>
<script>
var BAY = Number(param('no', '1')), st = null, stAt = 0, announced = {}, busy = false;
document.getElementById('no').textContent = BAY + '번 타석';
function poll() { apiGet('status').then(function (s) { if (s) { st = s; stAt = Date.now(); render(); } }).catch(function () {}); }
function render() {
  if (!st) return;
  var b = st.bays.filter(function (x) { return x.no === BAY; })[0]; if (!b) return;
  if (b.status === 'busy') {
    var r = Math.max(0, Math.round((b.endAt - (st.now + Date.now() - stAt)) / 1000));
    document.body.className = r <= st.warnSec ? 'warn' : '';
    document.getElementById('state').textContent = '사용 중 · ' + durLabel((b.endAt - b.startAt) / 1000) + ' 이용';
    document.getElementById('time').textContent = mmss(r);
    if (document.getElementById('cf').style.display === 'none') document.getElementById('end').style.display = '';
    var k = b.endAt;
    if (r <= st.warnSec && r > 0 && !announced[k + 'w']) { announced[k + 'w'] = 1; speak(BAY + '번 타석, 종료 ' + durLabel(st.warnSec) + ' 전입니다.'); }
    if (r === 0 && !announced[k + 'e']) { announced[k + 'e'] = 1; speak(BAY + '번 타석 이용시간이 종료되었습니다.'); }
  } else {
    document.body.className = '';
    document.getElementById('state').textContent = b.status === 'held' ? '입장 대기 중' : '이용 가능';
    document.getElementById('time').textContent = '--:--';
    document.getElementById('end').style.display = 'none'; document.getElementById('cf').style.display = 'none';
  }
}
function ask() { document.getElementById('end').style.display = 'none'; document.getElementById('cf').style.display = ''; }
function cancel() { document.getElementById('cf').style.display = 'none'; render(); }
function endNow() { if (busy) return; busy = true; apiPost('end', { bay: BAY }).then(function () { busy = false; cancel(); poll(); }).catch(function () { busy = false; }); }
setInterval(function () { if (st) render(); }, 1000);
poll(); setInterval(poll, 10000);
</script>
</body>
</html>
