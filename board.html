<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타석 현황 (테스트)</title>
<script src="config.js"></script>
<style>
  body { margin: 0; font-family: sans-serif; background: #fff; color: #111; padding: 2vw; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; gap: 2vh; }
  h1 { margin: 0; font-size: 3vw; display: flex; justify-content: space-between; }
  #bays { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5vw; }
  .bay { border: 3px solid #999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1vh; font-size: 2vw; text-align: center; }
  .bay b { font-size: 3vw; }
  .bay .t { font-size: 5vw; font-weight: bold; }
  .free { border-color: #2a2; } .busy { border-color: #c22; } .warn { border-color: #e90; background: #fff6e0; } .held { border-color: #36c; }
  #q { font-size: 2vw; border-top: 1px solid #ccc; padding-top: 1vh; }
  #unlock { position: fixed; inset: 0; background: rgba(0,0,0,.7); color: #fff; font-size: 3vw; display: none; align-items: center; justify-content: center; }
</style>
</head>
<body>
  <h1><span>스크린 타석 현황 (테스트)</span><span id="clock"></span></h1>
  <div id="bays"></div>
  <div id="q">대기 0명</div>
  <div id="unlock">클릭하면 음성 안내가 켜집니다</div>
<script>
var st = null, stAt = 0, announced = {};
if (VOICE) { var u = document.getElementById('unlock'); u.style.display = 'flex'; u.onclick = function () { speak(' '); u.style.display = 'none'; }; }

function poll() { apiGet('status').then(function (s) { if (s) { st = s; stAt = Date.now(); render(); } }).catch(function () {}); }
function rem(b) { return b.endAt ? Math.max(0, Math.round((b.endAt - (st.now + Date.now() - stAt)) / 1000)) : 0; }

function render() {
  if (!st) return;
  var g = document.getElementById('bays'); g.innerHTML = '';
  st.bays.forEach(function (b) {
    var r = rem(b), d = document.createElement('div');
    var cls = b.status === 'busy' ? (r <= st.warnSec ? 'warn' : 'busy') : b.status;
    d.className = 'bay ' + cls;
    if (b.status === 'free') d.innerHTML = '<b>' + b.no + '번</b><div>이용 가능</div>';
    else if (b.status === 'held') d.innerHTML = '<b>' + b.no + '번</b><div>입장 대기</div>';
    else d.innerHTML = '<b>' + b.no + '번</b><div>' + (cls === 'warn' ? '곧 종료' : '사용 중') + '</div><div class="t">' + mmss(r) + '</div><div>' + durLabel((b.endAt - b.startAt) / 1000) + ' 이용</div>';
    g.appendChild(d);
  });
  var txt = '대기 ' + (st.waiting.length + st.calls.length) + '명';
  st.calls.forEach(function (c) {
    txt += ' | 호출: ' + c.name + '(' + c.phone4 + ') → ' + c.bay + '번';
    if (!announced['c' + c.row]) { announced['c' + c.row] = 1; speak('대기 고객 ' + c.name + '님, ' + bayWord(c.bay) + '번 타석 이용 가능합니다. 입구 태블릿에서 입장을 시작해 주세요.'); }
  });
  st.waiting.forEach(function (w, i) { txt += ' | ' + (i + 1) + '. ' + w.name + '(' + w.phone4 + ')'; });
  document.getElementById('q').textContent = txt;
}
setInterval(function () { document.getElementById('clock').textContent = new Date().toTimeString().slice(0, 5); if (st) render(); }, 1000);
poll(); setInterval(poll, 5000);
</script>
</body>
</html>
